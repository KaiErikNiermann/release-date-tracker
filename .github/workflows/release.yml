name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  POETRY_VERSION: "2.1.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # release notes are generated from the log

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Never pipx: it binds Poetry to the runner's own interpreter, which Poetry then
      # rejects against requires-python. See the note in ci.yml.
      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A tag whose name disagrees with pyproject is the one release bug that is
      # invisible until someone installs it, so fail here rather than ship it.
      - name: Verify the tag matches pyproject
        run: |
          declared=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.version.outputs.tag }} != pyproject version $declared"
            exit 1
          fi

      - name: Build
        run: poetry build

      - name: Smoke-test the artifact
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/rdt --help > /dev/null

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            dist/*
