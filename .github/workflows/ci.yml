name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a PR makes the in-flight run irrelevant; main is never cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Installed with `python -m pip`, never pipx: pipx binds Poetry to the runner's own
  # interpreter (3.12 on ubuntu-latest), and Poetry validates the version it is *running
  # under* against requires-python — so every job failed before it started.
  POETRY_VERSION: "2.1.3"

jobs:
  lint:
    name: lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"
      - run: poetry install --with dev
      - name: Lint
        run: poetry run ruff check src tests
      - name: Format check
        run: poetry run ruff format --check src tests
      - name: Project rules (semgrep)
        run: poetry run semgrep --config .semgrep/ --error --quiet src tests
      - name: Type-check (strict)
        run: poetry run pyright src tests

  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install dependencies
        run: poetry install --with dev

      # No .env and no API keys on any runner, on purpose: every test must pass keyless,
      # which is also the promise the README makes to anyone installing this.
      - name: Tests
        run: poetry run pytest

      # The console script is the thing a user actually types, and it is wired up by the
      # packaging metadata rather than by anything the test suite imports. Run it from a
      # directory that is not the checkout, so a CWD-relative path bug cannot hide.
      - name: Smoke-test the CLI outside the checkout
        shell: bash
        run: |
          cd "$HOME"
          poetry -C "$GITHUB_WORKSPACE" run rdt --help
          poetry -C "$GITHUB_WORKSPACE" run rdt upcoming

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"
      - name: Build
        run: poetry build

      # Proves the artifact is installable and its entry point works — the failure a test
      # suite run from a checkout can never catch.
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/rdt --help
          cd /tmp && /tmp/smoke/bin/rdt upcoming

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
